name: OpenCode latest releases

# The isolation plugins depend on experimental OpenCode hooks and on how OpenCode renders
# instructions, which can change in any release. This probes the newest release of each major
# version weekly. It never runs on pull requests, so upstream releases cannot block changes;
# a red run means do not upgrade yet. See "Host versions" in docs/opencode.md.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    name: native-probe (${{ matrix.host }}, latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: v1
            package: opencode-linux-x64
            major: '1'
          - host: v2
            package: '@opencode/cli-linux-x64'
            major: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the newest OpenCode executable of this major version
        env:
          PACKAGE: ${{ matrix.package }}
          MAJOR: ${{ matrix.major }}
          PREFIX: ${{ runner.temp }}/opencode-latest
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix "$PREFIX" "$PACKAGE@$MAJOR"
      - name: Exercise native child permissions and instruction isolation
        env:
          HOST: ${{ matrix.host }}
          OPENCODE: ${{ runner.temp }}/opencode-latest/node_modules/${{ matrix.package }}/bin/opencode
          PROBE_OUTPUT: ${{ runner.temp }}/opencode-native-probe
        run: >-
          python tests/integration/opencode_native_probe.py
          --host "$HOST"
          --source .
          --opencode "$OPENCODE"
          --output "$PROBE_OUTPUT"
