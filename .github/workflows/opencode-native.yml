name: OpenCode native probe

on:
  pull_request:
    paths:
      - '.github/workflows/opencode-native.yml'
      - 'adapters/opencode/**'
      - 'agents/**'
      - 'docs/opencode.md'
      - 'docs/opencode_v2.md'
      - 'resources/**'
      - 'skills/**'
      - 'plugin.json'
      - 'tests/integration/opencode-ci/**'
      - 'tests/integration/opencode_native_probe.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/opencode-native.yml'
      - 'adapters/opencode/**'
      - 'agents/**'
      - 'docs/opencode.md'
      - 'docs/opencode_v2.md'
      - 'resources/**'
      - 'skills/**'
      - 'plugin.json'
      - 'tests/integration/opencode-ci/**'
      - 'tests/integration/opencode_native_probe.py'

permissions:
  contents: read

jobs:
  native-probe:
    name: native-probe (${{ matrix.host }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: v1
            package: opencode-linux-x64
            binary: node_modules/opencode-linux-x64/bin/opencode
          - host: v2
            package: '@opencode/cli-linux-x64'
            binary: node_modules/@opencode/cli-linux-x64/bin/opencode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install pinned OpenCode executables
        working-directory: tests/integration/opencode-ci
        run: npm ci --ignore-scripts
      - name: Exercise native child permissions and instruction isolation
        env:
          HOST: ${{ matrix.host }}
          OPENCODE: tests/integration/opencode-ci/${{ matrix.binary }}
          PROBE_OUTPUT: ${{ runner.temp }}/opencode-native-probe
        run: >-
          python tests/integration/opencode_native_probe.py
          --host "$HOST"
          --source .
          --opencode "$OPENCODE"
          --output "$PROBE_OUTPUT"
